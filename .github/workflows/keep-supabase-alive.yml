# Evita que o projeto Supabase (plano gratuito) seja pausado por inatividade.
name: Keep Supabase Alive
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          KEY=$(curl -s https://raw.githubusercontent.com/${{ github.repository }}/main/app.js | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+' | head -1)
          curl -sf "https://cvqzsshhgzxmhbmafrui.supabase.co/auth/v1/health" -H "apikey: $KEY"
          curl -s "https://cvqzsshhgzxmhbmafrui.supabase.co/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null -w "REST status: %{http_code}\n"
